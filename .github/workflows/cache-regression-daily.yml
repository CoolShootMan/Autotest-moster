name: cache-regression-daily

on:
  schedule:
    # 每天 10:00 北京时间（UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cache-regression:
    name: cache-regression-daily-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install httpx pytest pytest-asyncio playwright
          # SSR 用例依赖浏览器 console 抓取，需安装 chromium
          playwright install --with-deps chromium

      - name: Run cache-regression tests
        working-directory: test_case/performance testing/cache-regression
        run: pytest -v

      - name: Upload test output (audit report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-regression-output
          path: test_case/performance testing/cache-regression/output

      # 失败通知：方案 B，走 GitHub 原生通知（无 SMTP）。
      # 需将该 GitHub 账号的通知邮箱设为 linda.zhou.ext@1m.app 并开启 Actions 通知，
      # workflow run 失败时 GitHub 会自动发邮件，无需额外配置。
