# ------------------ Section - link -> general link text align ------------------------
testT5210_5211_5212:  # [LAST: FIXED 2026-07-24] — New storefront flow: Add → Create link → General Link → add to a new section; then edit alignment.
    description: "Verify that the user can set text alignment (center/right) on General Link cards within a section"
    test_step:
        open: "{BASE_URL}/autotestshop"
        sleep_after_open: 3000
        # Step 1: Create a General Link with Align left and assign it to a new section.
        R_click_add: { role: 'button', name: 'Add' }
        R_click_create_link: { role: 'button', name: 'Create link' }
        R_click_general_link_type: { text: 'General Link', exact: true }
        R_click_continue: { role: 'button', name: 'Continue' }
        fill_url: { locator: 'input[name="url"]', value: 'baidu.com' }
        fill_title: { locator: 'input[name="title"]', value: 'test align' }
        click_align_left: { locator: 'button[aria-label="Align left"]' }
        R_click_add_link: { locator: "button", text: 'Add', exact: true }
        sleep_after_add_link: 3000
        R_click_add_to_new_section: { locator: '[data-testid="mui-list-item-button"][aria-label="Select to create new module"]' }
        fill_section_title: { role: 'textbox', name: 'Enter the title of the section', value: 'general link text align' }
        R_click_apply: { locator: "button", text: 'Apply', exact: true }
        sleep_after_apply: 3000
        # Verify default text alignment is left
        verify_element_style_left: { container: 'general link text align', container_filter: '../..', locator: '[data-testid="base-general-link-card-title"]', property: 'textAlign', expected: 'left' }

        # Step 3: Edit link card and set Align left
        click_module_item_more_icon: { module_name: 'general link text align', index: -1 }
        sleep_after_card_action: 1000
        R_click_edit: { locator: "[role='menuitem']", text: 'Edit', exact: true }
        sleep_after_edit: 1000
        click_align_center: { locator: 'button[aria-label="Align center"]' }
        sleep_after_align_center: 500
        R_click_save: { locator: "button", text: 'Save', exact: true }
        sleep_after_save: 3000
        # Verify text alignment changed to center
        verify_element_style_center: { container: 'general link text align', container_filter: '../..', locator: '[data-testid="base-general-link-card-title"]', property: 'textAlign', expected: 'center' }
        # Step 4: Edit link card again and set Align right
        click_module_item_more_icon_2: { module_name: 'general link text align', index: -1 }
        sleep_after_card_action_2: 1000
        R_click_edit_2: { locator: "[role='menuitem']", text: 'Edit', exact: true }
        sleep_after_edit_2: 1000
        click_align_right: { locator: 'button[aria-label="Align right"]' }
        R_click_save_2: { locator: "button", text: 'Save', exact: true }
        sleep_after_save_2: 3000
        # Verify text alignment changed to right
        verify_element_style_right: { container: 'general link text align', container_filter: '../..', locator: '[data-testid="base-general-link-card-title"]', property: 'textAlign', expected: 'right' }
        # Step 5: Verify "Add from my content" -> Links tab shows the link with preserved alignment
        R_click_add_2: { role: 'button', name: 'Add' }
        R_click_add_from_my_content: { role: 'button', name: 'Add from my content' }
        sleep_after_my_content: 2000
        R_click_links_tab: { role: 'tab', name: 'Links' }
        sleep_after_links_tab: 2000
        verify_element_style_my_links_align:
            locator: "xpath=//*[@role='dialog']//p[contains(text(), 'test align')]/../../.."
            property: "alignItems"
            expected: "center"
        R_click_close: { role: 'button', name: 'Close' }

    expect_result:
        description: "Verify that General Link card text alignment can be set to center and right successfully"
        assertions:
            - assertion_type: "element_visible_by_text"
              text: "general link text align"
            - assertion_type: "element_visible_by_text"
              text: "test align"
