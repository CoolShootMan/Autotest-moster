testT3788:  # [LAST: FIXED 2026-07-23 v3] — New storefront flow on partnercoseller997: select posts/products first, then create section; add more product via section "+" -> Add products Existing
    description: "Verify adding products to a new section"
    test_step:
        open:
            url: "{BASE_URL}/partnercoseller997"
            cookie_file: "test_case/UI/Test_Katana/cookie_{ENV}_partner_coseller.json"
        sleep_after_open: 5000
        # 1. Select 1 post + 2 products from my posts, then create the section.
        R_click_add: { role: 'button', name: 'Add' }
        R_click_add_products_existing: { role: 'button', name: 'Add products Existing' }
        R_click_posts_tab: { role: 'tab', name: 'Posts' }
        # R_click_select_my_posts: { role: 'combobox', name: 'Select from my posts' }
        #R_click_post_t3788: { text: 'auto test T3788' }
        R_click_product_img_1: { role: 'img', name: 'Image of Product', index: 0 }
        R_click_product_img_2: { role: 'img', name: 'Image of Product', index: 1 }
        R_click_continue_1: { role: 'button', name: 'Continue' }
        R_click_untitled_section: { role: 'button', name: 'Upcoming Events' }
        R_click_create_new_module: { role: 'button', name: 'Select to create new module' }
        fill_section_title: { role: 'textbox', name: 'Enter the title of the section', value: 'Section-products' }
        R_click_apply: { role: 'button', name: 'Apply' }
        # 2. Add another product via the section's "+" button.
        # Anchor on the section header stack (katana-1g3r82v) that contains the Section-products title,
        # then click the first button in its katana-15ou9qk button stack. This is the "+" icon.
        # Using katana-1g3r82v as the header scope prevents matching ancestor containers.
        R_click_section_plus: { locator: "//div[contains(@class,'katana-1g3r82v')][.//*[normalize-space(text())='Section-products']]//div[contains(@class,'katana-15ou9qk')]/button", index: 0 }
        R_click_add_products_existing_2: { role: 'button', name: 'Add products Existing' }
        R_click_first_product_card: { locator: ".katana-xmbpup", index: 0 }
        R_click_continue_2: { role: 'button', name: 'Continue' }
        #sleep_after_add: 3000
        # 3. Verify the added product is rendered in Section-products.
        # The section body does not use data-testid='shop-brand' for these ticket-style cards;
        # verify by the product title text that was selected in the Catalogs grid.
        verify_text_visible: { text: "auto-test-997-default-product", timeout: 3000 }
    expect_result:
        description: "Verify that the new section 'Section-products' is added successfully with the selected product"
        assertions:
            - assertion_type: "element_visible_by_text"
              text: "auto-test-997-default-product"

