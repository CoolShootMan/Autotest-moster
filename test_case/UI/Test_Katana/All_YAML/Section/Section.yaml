# ------------------ Section - link -> general link ------------------------
testT3843:  # [LAST: FIXED 2026-07-24] — New storefront flow: Add → Create link → General Link → add to a new/existing section
    description: "Verify that the user adds the link card of General Link on the shop page(sections) and section menu"
    test_step:
        open: "{BASE_URL}/autotestshop"
        sleep_after_open: 3000
        # Create the first General Link and assign it to a new section.
        R_click_add: { role: 'button', name: 'Add' }
        R_click_create_link: { role: 'button', name: 'Create link' }
        R_click_general_link_type: { text: "General Link", exact: true }
        R_click_continue: { role: 'button', name: 'Continue' }
        fill_url_1: { locator: 'input[name="url"]', value: 'baidu.com' }
        fill_title_1: { placeholder: 'As the bold title on your', value: 'test link1' }
        R_click_add_link_1: { locator: "//*[@data-testid='button']", text: "Add", exact: true }
        sleep_after_add_link_1: 3000
        # "Add to a new section" is a MUI ListItemButton; use its data-testid + aria-label to avoid modal-scoping issues.
        R_click_add_to_new_section: { locator: '[data-testid="mui-list-item-button"][aria-label="Select to create new module"]' }
        fill_section_title: { role: 'textbox', name: 'Enter the title of the section', value: 'Link1' }
        R_click_apply: { locator: '[data-testid="enhance-button"]', text: 'Apply', exact: true }
        sleep_after_apply_1: 3000
        # Create a second General Link and add it to the existing Link1 section.
        R_click_add_2: { role: 'button', name: 'Add' }
        R_click_create_link_2: { role: 'button', name: 'Create link' }
        R_click_general_link_type_2: { text: "General Link", exact: true }
        R_click_continue_2: { role: 'button', name: 'Continue' }
        fill_url_2: { locator: 'input[name="url"]', value: 'baidu.com' }
        fill_title_2: { placeholder: 'As the bold title on your', value: 'test link2' }
        click_align_center: { locator: 'button[aria-label="Align center"]' }
        R_click_add_link_2: { locator: "//*[@data-testid='button']", text: "Add", exact: true }
        sleep_after_add_link_2: 3000
        # Existing sections are also MUI ListItemButtons; scope by text.
        R_click_select_section_link1: { locator: '[data-testid="mui-list-item-button"]', text: 'Link1', exact: true }
        R_click_apply_2: { locator: '[data-testid="enhance-button"]', text: 'Apply', exact: true }
        sleep_after_apply_2: 3000
    expect_result:
        description: "Verify that the new General Link section is successfully added and formatted"
        assertions:
            - assertion_type: "element_visible_by_text"
              text: "Link1"
            - assertion_type: "element_visible_by_text"
              text: "test link1"
            - assertion_type: "element_visible_by_text"
              text: "test link2"

# ------------------ Section - carousel nav buttons ------------------------
testT4600_4602:  # [HARDENED 2026-07-27] — New storefront flow: bottom Add → Create link → General Link → new "test nav buttons" section → Edit section → Layout → Carousel → add links 2/3 → verify carousel scroll (next/prev scroll by one card via tagged scroller; next hidden at last). Pre-cleanup + teardown use delete_all_sections_by_name so the section never accumulates stale cards.
    description: "Verify carousel section horizontal scroll navigation: links slide by one link width on next/prev, next button hidden at last element, nav buttons only visible on hover"
    test_step:
        open: "{BASE_URL}/autotestshop"
        sleep_after_open: 5000

        # Pre-cleanup: remove any stale 'test nav buttons' sections so we start from a clean 3-link carousel.
        delete_all_sections_by_name: { module_name: 'test nav buttons' }
        sleep_after_pre_clean: 2000

        # Step 1: Create link1 and a new dedicated General Link section "test nav buttons".
        R_click_add_1: { role: 'button', name: 'Add' }
        R_click_create_link_1: { role: 'button', name: 'Create link' }
        R_click_general_link_type_1: { text: 'General Link', exact: true }
        R_click_continue_1: { role: 'button', name: 'Continue' }
        sleep_after_continue_1: 1500
        fill_url_1: { locator: 'input[name="url"]', value: 'baidu.com' }
        fill_title_1: { locator: 'input[name="title"]', value: 'title1' }
        R_click_add_link_1: { locator: "button", text: 'Add', exact: true }
        sleep_after_add_link_1: 3000
        R_click_add_to_new_section_1: { locator: '[data-testid="mui-list-item-button"][aria-label="Select to create new module"]' }
        sleep_after_add_to_new_section_1: 1500
        fill_section_title_1: { role: 'textbox', name: 'Enter the title of the section', value: 'test nav buttons' }
        R_click_apply_1: { role: 'button', name: 'Apply' }
        sleep_after_apply_1: 5000

        # Step 1b: Switch the new section to Carousel layout.
        # New storefront defaults to Vertical Scroll; Edit section → Layout → Carousel is required.
        click_module_edit_button: { module_name: 'test nav buttons' }
        sleep_after_edit_button_click: 1000
        R_click_edit_section: { text: 'Edit section', exact: true }
        sleep_after_edit_section: 1500
        R_click_carousel_layout: { text: 'Carousel', exact: true }
        sleep_after_carousel_layout: 500
        R_click_save_layout: { role: 'button', name: 'Save', exact: true }
        sleep_after_save_layout: 3000

        # Step 2: Add link2 to the existing "test nav buttons" section.
        R_click_add_2: { role: 'button', name: 'Add' }
        R_click_create_link_2: { role: 'button', name: 'Create link' }
        R_click_general_link_type_2: { text: 'General Link', exact: true }
        R_click_continue_2: { role: 'button', name: 'Continue' }
        sleep_after_continue_2: 1500
        fill_url_2: { locator: 'input[name="url"]', value: 'baidu.com' }
        fill_title_2: { locator: 'input[name="title"]', value: 'title2' }
        R_click_add_link_2: { locator: "button", text: 'Add', exact: true }
        sleep_after_add_link_2: 3000
        R_click_select_section_2: { role: 'button', name: 'test nav buttons' }
        R_click_apply_2: { role: 'button', name: 'Apply' }
        sleep_after_apply_2: 5000

        # Step 3: Add link3 to the existing "test nav buttons" section.
        R_click_add_3: { role: 'button', name: 'Add' }
        R_click_create_link_3: { role: 'button', name: 'Create link' }
        R_click_general_link_type_3: { text: 'General Link', exact: true }
        R_click_continue_3: { role: 'button', name: 'Continue' }
        sleep_after_continue_3: 1500
        fill_url_3: { locator: 'input[name="url"]', value: 'baidu.com' }
        fill_title_3: { locator: 'input[name="title"]', value: 'title3' }
        R_click_add_link_3: { locator: "button", text: 'Add', exact: true }
        sleep_after_add_link_3: 3000
        R_click_select_section_3: { role: 'button', name: 'test nav buttons' }
        R_click_apply_3: { role: 'button', name: 'Apply' }
        sleep_after_apply_3: 5000

        # Step 4: Verify carousel scroll behavior.
        verify_carousel_scroll_module:
            module_name: 'test nav buttons'
            link_item_selector: 'div[data-testid="base-general-link-card"]'
            tolerance: 10

    expect_result:
        description: "Verify carousel navigation: clicking next/prev slides content by exactly one link width, next button hidden at last element, nav buttons only visible on hover"
        assertions:
            - assertion_type: "element_visible_by_text"
              text: "test nav buttons"
            - assertion_type: "element_visible_by_text"
              text: "title1"
            - assertion_type: "element_visible_by_text"
              text: "title2"
            - assertion_type: "element_visible_by_text"
              text: "title3"

    teardown_step:
        # Delete ALL 'test nav buttons' sections (reliable cleanup so they never accumulate across runs).
        delete_all_sections_by_name: { module_name: 'test nav buttons' }
        sleep_after_teardown_clean: 3000

