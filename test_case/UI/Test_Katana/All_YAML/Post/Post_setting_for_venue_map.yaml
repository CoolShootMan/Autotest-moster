# ==============================================================================
# Test Case: T1742 Verify that the Post commission rate can be Batch setting to a Fix value
# Step description:
# 1. MC puts two Items when creating a Post, one is a self_listing product and the other is a resale product. 
# 2. Click and open "Share this post with promoters?" under Post setting. 
# 3. Click "Bulk set", Set the commission rate to 50% in "Bulk set a promoter commission" 
# 4. Click "Apply to all" 
# 5. Click "Publish" and ”Confirm“ 
# 6. Use one account to purchase two products in Post and check the commission
# Expected result:
# Successfully published a post with batch setting of commission rate, and the combined commission is calculated correctly.
# (self_listing products with "your", total commission rate is 0%)
# ==============================================================================

# T1742: Post commission Batch set to 10%
#Auth: Linda Zhou
testT1742:
    description: "Post commission Batch set to 10%"
    pre_condition:
        description: "delete the resold post"
        expect_result: "Co-seller post deleted successfully or no data to delete"
        test_step:
            # Step 1: Events list page -> click Event card
            open: "{BASE_URL}/events"
            sleep_step: 5000

            # "Auto-Test-post-setting" is a DIV element (not BUTTON), use exact text match
            R_click_my_event: { locator: "text=event-for-UI-auto-venue-map", exact: true, index: 0 }
            sleep_step: 4000

            # Step 1.1: Click Posts tab to ensure post cards are visible
            R_click_posts_tab: { role: "tab", name: "Post" }
            sleep_step: 2000

            # Step 2: Event detail page -> click Post card (link text)
            # [UI drift 2026-08-31] "View post" button removed (Post tab shows post directly)

            # Step 3: Navigate to Co-selling -> Co-sellers tab
            R_click_Co-selling: { role: "tab", name: "Co‑selling" }

            sleep_step: 2000
                    # [UI drift 2026-08-31] "Co-sellers" is no longer a separate tab; co-seller management is inline in the Co‑selling panel (table column). Navigation step removed.
            sleep_step: 2000

            # Step 4: Delete co-seller if exists (encapsulated action)
            # If MoreHorizIcon button found -> delete flow; if not found -> skip silently
            delete_coseller_if_exists: { timeout: 10000, toast_timeout: 8000 }
            sleep_step: 3000

    test_step:

        # Step 5: Post detail page -> Selling tab -> Customize -> Batch set commission rates
        R_click_selling: { role: 'tab', name: 'Selling' }
        sleep_step: 2000
        R_click_customize: { role: 'button', name: 'Customize' }
        sleep_step: 2000

        # Handle optional "Set resale earnings" dialog -> click "Start Customizing"
        smart_click_optional_start_customizing: { role: 'button', name: 'Start Customizing' }
        sleep_step: 1000

        #Handle optional "Choose a resale model" tooltip/popover -> click "Done"
        #Note: Done is a <p> element, not <button>, need to use text locator
        #Now base.py supports tooltip/popover selectors, text locator should work normally
        smart_click_optional_done_1: { name: 'Done' }
        sleep_step: 1000
        smart_click_optional_done_2: { name: 'Done' }
        sleep_step: 1000

        # smart_click_optional_done_1: { name: 'Done' }

        R_click_batch_set: { role: 'button', name: 'Batch set commission for all products' }
        sleep_step: 1500

        # Step 4: Fill commission 10 -> Confirm -> Save
        fill_commission: { placeholder: "e.g., 5", value: '10' }
        sleep_step: 3000
        R_click_confirm_value: { role: 'button', name: 'Confirm' }
        sleep_step: 1500

        # Save (skip if already at 10%, Save will be disabled)
        R_click_save_1: { role: 'button', name: 'Save', skip_if_disabled: true, disable_ai: true }
        # Optimization: wait for Save button to become disabled, indicating save is complete
        R_click_save_2: { role: 'button', name: 'Save', skip_if_disabled: true, disable_ai: true }
        # Optimization: wait for toast to appear, confirming backend save is successful
        wait_toast_success: { message: "Post products updated", timeout: 15000 }

        R_click_close_drawer: { locator: '[data-testid="CloseIcon"]', optional: true, disable_ai: true }
        sleep_step: 2000

        # Step 5: Verify Post Card displays "Offer up to 10%"
        verify_post_offer:
            scope: { text: "event-for-ui-auto-venue-map" }
            text: "Offer up to 10%"
            timeout: 5000

        # Step 6: Reopen Events > Post tab to verify
        open_again: "{BASE_URL}/events"
        R_click_event: { locator: "event-for-UI-auto-venue-map", exact: true, index: 0 }
        sleep_step: 4000
        R_click_posts_tab:      { role: "tab", name: "Post" }
        sleep_end: 3000

    expect_result:
        assertions:
          - assertion_type: "element_visible_by_text"
            text: "10"

    teardown_step:
        R_click_post_teardown: { role: 'button', name: 'View post', index: 0 }
        sleep_step: 3000
        R_click_selling_teardown: { role: 'tab', name: 'Selling' }
        sleep_step: 2000
        R_click_customize_teardown: { role: 'button', name: 'Customize' }
        sleep_step: 3000
        R_click_batch_set_teardown: { role: 'button', name: 'Batch set commission for all products' }
        sleep_step: 1500
        # Restore commission to 8 (different from test value 10, to ensure Save is clickable)
        fill_commission_teardown: { placeholder: "e.g., 5", value: '8' }
        sleep_step: 1000
        R_click_confirm_teardown: { role: 'button', name: 'Confirm' }
        sleep_step: 1500

        # teardown Save (commission changed from 10->8, Save is clickable; add skip_if_disabled for safety)
        R_click_save_teardown_1: { role: 'button', name: 'Save', skip_if_disabled: true }
        # Optimization: wait for Save button to become disabled, indicating save is complete
        R_click_save_teardown_2: { role: 'button', name: 'Save', skip_if_disabled: true }
        sleep_step: 2000
        # Optimization: wait for toast to appear, confirming backend save is successful
        wait_toast_success_teardown: { message: "Post products updated", timeout: 15000 }

        R_click_close_drawer_teardown: { locator: '[data-testid="CloseIcon"]', optional: true }
        sleep_end: 1000
        # Step 5: Verify Post Card auto-test-post-setting-t1742 displays "Offer up to 8%"
        # Use scope to limit search within the specific post card containing auto-test-post-setting-t1742
        verify_post_offer:
            scope: { text: "event-for-ui-auto-venue-map" }
            text: "Offer up to 8%"
            timeout: 5000

testT3991_VerifyPartner:
    description: "Verify that partner can set a note for co-sellers in a post"
    test_step:
        open: "{BASE_URL}/events"
        sleep_after_open: 5000
        # "Auto-Test-post-setting" is a DIV element (not BUTTON), use exact text match
        R_click_my_event: { locator: "text=event-for-UI-auto-venue-map", exact: true, index: 0 }
        sleep_step: 3000
        # [UI drift 2026-08-31] Event detail no longer has a top-level "Co-selling" tab.
        # Co-selling is now a sub-tab inside the Post tab's post view.
        R_click_posts_tab: { role: 'tab', name: 'Post' }
        sleep_step: 2000
        click_coselling_tab: { role: 'tab', name: 'Co‑selling' }
        # [Idempotency 2026-09-01] The "Add to co-seller Pear Shops" button disappears once any co-seller
        # is added (UI switches to "Invite" + "Sync posts"). Use the framework's delete action to clean any
        # leftover co-sellers so this test can be re-run safely. The pre-check uses an MUI icon name that
        # may not match the rendered DOM, so this step is `optional` — if pre-check fails we fall through
        # and the subsequent add-coseller chain also degrades gracefully (see below).
        delete_coseller_if_exists: { timeout: 15000, optional: true }
        sleep_step: 1000
        # [UI drift 2026-09-01] Co‑selling panel now opens in OFF state with a single "Turn on Co-selling" CTA.
        # Clicking it opens a "Customize product settings" dialog (default 7% commission) which must be Saved
        # before the co-seller management buttons appear. Both steps are `optional` so the test stays
        # idempotent when Co‑selling is already ON for this post (state persists across runs).
        R_click_turn_on_coselling: { role: 'button', name: 'Turn on Co-selling', optional: true, disable_ai: true }
        sleep_step: 1000
        R_click_save_customize: { role: 'button', name: 'Save', optional: true, disable_ai: true }
        sleep_step: 1500
        # [UI drift 2026-09-01] Co-seller add button label is `Add to co-seller Pear Shops` (singular, lowercase c).
        # The "Add to Co-sellers' Shops" string is the dialog TITLE that opens after this click — NOT the button.
        # All add-coseller steps are `optional` so the test skips the add cleanly when a co-seller already
        # exists from a prior run (the button is hidden, replaced by "Invite" / "Sync posts").
        click_mui_btn: { role: 'button', name: 'Add to co-seller Pear Shops', optional: true }
        sleep_step: 1500
        check_coseller_checkbox: { role: 'checkbox', index: 1, optional: true }
        click_add_btn: { role: 'button', name: 'Add', optional: true }

        # Must assertion 2: Toast message after successfully adding co-seller (only fires on a fresh add).
        verify_toast_post_added: { text: "Adding posts to selected co-seller shops. This may take a few seconds. Click Refresh to see the latest progress.", optional: true }
        sleep_after_toast_1: 1500

        # [UI drift 2026-09-01] Post "Settings" is a Content-sub-tab action card (Content/Style/Settings/Tools).
        # The Co‑selling sub-tab does NOT render these action cards, so we must switch back to Content first.
        R_click_content_tab: { role: 'tab', name: 'Content' }
        sleep_step: 1500
        # [UI drift 2026-08-31] Post "Settings" is now an action card (not a sub-tab); clicking it
        # navigates to the standalone /post/<id>/settings page.
        R_click_settings_card: { role: 'button', name: 'Settings' }
        
        # Must assertion 3: Verify setting item is visible
        verify_note_visible: { text: "Add a note for co-sellers" }
        
        check_enable_downline_note: { locator: 'input[name="enableDownlineNote"]' }
        fill_note: { role: 'textbox', name: 'Enter a short message for', value: 'test_3991' }
        click_apply_btn_2: { role: 'button', name: 'Apply' }
        sleep_after_apply: 1000
        click_save_settings_btn: { role: 'button', name: 'Save' }
        sleep_after_save_settings: 3000

        # Must assertion 4: Toast message after configuration is complete
        verify_toast_settings_updated: { text: "Post settings updated", optional: true }
        
    expect_result:
        description: "Partner should be able to set a note for co-sellers successfully."
        assertions: []



# ==============================================================================
# Test Case: T3683 & T3684
# T3683: Verify the user can edit order confirmation note for original post
# T3684: Verify the order confirmation note is displayed on order placed page
#
# Step description:
# 1. Open Events -> click Auto-Test-post-setting -> click Get Tickets -> enter Post edit page
# 2. T3683: Switch to Settings tab, enable "Order confirmation note" toggle, input note, save
# 3. T3684: Add to cart, checkout, place order
#           Verify confirmation note displayed on order placed page and order details page
#
# Expected result:
# 1. T3683: On Settings tab, "Order confirmation note" toggle default is OFF
#           After enabling: input box shows placeholder "e.g., Event time, location, or special instructions for buyers"
#           Max length 2000, saved successfully with toast
# 2. T3684: Confirmation note displayed below order details on order placed page
#           Confirmation note displayed below order instruction on order details page
# ==============================================================================


testT3683_T3684:
#Auth: Linda Zhou
    description: "Verify Order Confirmation Note - Edit in Settings Tab and Verify Display on Order Page"
    test_step:
        # Step 1: Events list page -> click Event card
        open: "{BASE_URL}/events"
        sleep_step: 5000

        # "Auto-Test-post-setting" is a DIV element (not BUTTON), use exact text match
        R_click_my_event: { locator: "text=event-for-UI-auto-venue-map", exact: true, index: 0 }
        sleep_step: 4000

        # Step 1.1: Click Posts tab to ensure post cards are visible
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 2: Event detail page -> click Post card (link text)
        # [UI drift 2026-08-31] "View post" button removed (Post tab shows post directly)
        sleep_step: 3000

        # Step 3: Post edit page -> switch to Settings tab
        R_click_settings_card: { role: 'button', name: 'Settings' }
        sleep_step: 1500

        # T3683 Step 1: Wait for Settings tab to load
        wait_advanced_loaded: { role: 'button', name: 'Settings', timeout: 8000 }
        sleep_step: 1000


        # T3683 Step 2: Click toggle to enable Order confirmation note (only when OFF -> ON)
        R_click_order_note_toggle: { locator: 'input[name="isOrderConfirmationNoteEnabled"]', skip_if_checked: true }
        sleep_step: 1000

        # T3683 Step 3: Verify toggle is enabled (input box appears)
        # Note: Use smart_wait to verify label exists (instead of verify_text_visible)
        wait_order_note_label: { text: "Order confirmation note", timeout: 8000 }
        fill_order_note: { placeholder: "e.g., Event time, location, or special instructions for buyers", value: 'Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID' }
        sleep_step: 500

        # T3683 Step 4: Save (skip if already saved, button disabled)
        R_click_save: { role: 'button', name: 'Save', skip_if_disabled: true }
        wait_toast_save: { message: "Post settings updated", timeout: 15000, optional: true }

        # Step 5: Close Post edit drawer, return to Event detail page
        R_click_close_drawer: { locator: '[data-testid="CloseIcon"]', optional: true, disable_ai: true }
        sleep_step: 2000

        # T3684: Guest checkout to verify confirmation note display
        # Step 5.1: Log out from Curator account
        open_account: "{BASE_URL}/account"
        sleep_step: 3000

        R_click_logout: { role: 'button', name: 'Log out' }
        sleep_step: 3000

        # Step 6: Directly access Post page for Guest ticket purchase
        open_post: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
        sleep_step: 3000

        # Step 7: Select product "General Admission 01", click its Buy Ticket button
        R_click_buy_ticket_ga01: { near_text: "General Admission 01", role: 'button', name: 'Buy Ticket', index: 0 }
        sleep_step: 1500
        # [UI drift 2026-09-01 venue_map] Venue-mapped post: clicking the product "Buy Ticket"
        # opens a "Select tickets" dialog. A table MUST be selected in the venue map before the
        # proceed buttons ("Add to cart" / "Buy now") appear. Click the first table cell
        # (SVG rect[data-id]); smart_click force-clicks past the transparent overlay rect that
        # intercepts pointer events. After selection "Buy now" becomes available and leads to the
        # contact-info page where the next step's "Continue" button appears (verified live).
        R_click_select_table: { locator: '[role="dialog"] rect[data-id]', index: 0, disable_ai: true }
        sleep_step: 1500
        smart_click_optional_buy_now: { role: 'button', name: 'Buy now', timeout: 3000 }

        # Step 7: Click Continue to enter Contact info page
        R_click_continue: { role: 'button', name: 'Continue' }
        sleep_step: 2000

        # Step 8: Fill Contact info
        fill_first_name: { locator: 'input[name="contact.firstName"]', value: 'auto' }
        sleep_step: 500

        fill_last_name: { locator: 'input[name="contact.lastName"]', value: 'Guest' }


        sleep_step: 500

        fill_phone: { locator: 'input[name="contact.phoneNumber"]', value: '+1 6502396646' }
        sleep_step: 500

        fill_email: { locator: 'input[name="contact.email"]', value: 'linda.zhou.ext+10@1m.app' }
        sleep_step: 500

        # Step 8.5: Fill Credit Card information (Stripe iframe)
        fill_stripe_iframe:
            card_number: '4242424242424242'
            expiry: '02/45'
            cvc: '345'
            card_name: 'linda 4650'
            zipcode: '90021'
        sleep_step: 1000

        # Step 10: Place Order
        R_click_place_order: { role: 'button', name: 'Place order' }
        sleep_step: 5000

        # Wait for order confirmation page to load ("Access Your Order" button appears)
        wait_for_access_order_button: { role: 'button', name: 'Access Your Order', timeout: 20000 }
        sleep_step: 2000

        # T3684 Expected: Verify confirmation note is displayed (no manual scroll needed, wait_for will auto-wait for visibility)
        verify_note_on_order_placed: { text: 'Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID' }
        sleep_end: 3000

    expect_result:
        assertions:
            # ===== T3684: Order Confirmation - Additional Details =====
            # These assertions run after all test steps complete, when on Order Placed page
            - assertion_type: "element_visible_by_text"
              text: "Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID"


