        sleep_step: 3000



# ==============================================================================
# T5390: Verify Post-Event auto sync (event info -> post title, post card, RTE)
# Pre-condition: Pre-created empty event "verify-post-shipping_fee" with published post
# Test focus: When event info (title/date/venue/description) is updated,
#             Post title, post card subtitle, and RTE components should auto-sync
# Note: "User customization does not sync" logic will be added in a separate case
# ==============================================================================
testT5390:
  description: "Verify event info updates auto-sync to post title, post card, and RTE components"
  test_step:
    # Step 1: Open events page and click event
    open: "{BASE_URL}/events"
    sleep_after_open: 5000

    # Click event "verify-post-shipping_fee"
    R_click_event: { role: "cell", name: "event-for-UI-auto-venue-map" }
    sleep_after_event: 3000

    # Step 2: Edit event basic info
    R_click_edit_event: { role: "button", name: "Edit event" }
    sleep_after_edit: 2000

    # Fill event title
    fill_event_title: { role: "textbox", name: "Event title", value: "T5390" }
    sleep_after_title: 1000

    # Set start date directly by bypassing React's controlled input value tracker
    # (MUI DatePicker input is readonly and controlled; clear button is unreliable)
    execute_js_set_start_date:
      script: '() => { const input = document.querySelector(`input[placeholder="MMMM DD, YYYY"]`) || document.querySelector(`input[type="text"][readonly]`); if (!input) return false; input.removeAttribute("readonly"); input.focus(); const lastValue = input.value; input.value = "Apr 20, 2053"; const tracker = input._valueTracker; if (tracker) tracker.setValue(lastValue); input.dispatchEvent(new Event("input", {bubbles: true})); input.dispatchEvent(new Event("change", {bubbles: true})); input.blur(); return true; }'
    sleep_after_set_start_date: 1000

    # Fill venue
    fill_venue: { role: "textbox", name: "Venue", value: "buy venue" }
    sleep_after_venue: 1000

    # Fill description
    fill_description: { role: "textbox", name: "Description (optional)", value: "T5390" }
    sleep_after_description: 1000

    # Save event
    R_click_save: { role: "button", name: "Save" }
    sleep_after_save: 3000

    # Step 3: Go to Posts tab and open post
    R_click_posts_tab: { role: "tab", name: "Post" }
    sleep_after_posts: 2000

    # Click post card
    # [UI drift 2026-08-31] Post card test_id click removed (Post tab shows post directly)
    sleep_after_post: 3000

    # === ASSERTION: Post title synced with event title "T5390" ===
    verify_post_title_synced: { text: "T5390" }

    # === ASSERTION: Post card subtitle synced with venue + date ===
    verify_subtitle_synced: { text: "buy venue | Sun, Apr 20" }

    # Step 4: Edit post content to verify RTE sync
    R_click_edit_content: { role: "button", name: "Edit content" }
    sleep_after_edit_content: 2000

    # === ASSERTION: Edit content page loaded (Post title field visible) ===
    verify_edit_loaded: { text: "Post title" }

    # === ASSERTION: RTE has event info component (venue synced to RTE) ===
    verify_rte_event_info: { text: "buy venue" }

    # === ASSERTION: RTE has description component (description synced to RTE) ===
    # "About" is the label, "T5390" is the content — rendered as "AboutT5390" in DOM
    verify_rte_description: { text: "AboutT5390" }

    # Step 5: Select description widget in RTE, then delete -> verify dialog -> Keep section (branch A)
    # Must click on the widget to select it before Delete button appears
    R_click_desc_widget: { text: "AboutT5390" }
    sleep_after_desc_widget: 500

    R_click_delete_desc: { role: "button", name: "Delete" }
    sleep_after_delete: 1000

    # === ASSERTION: Remove dialog appears with correct text ===
    verify_dialog_text: { text: "Remove Event description section?" }

    # Click Keep section -> component remains
    R_click_keep_section: { role: "button", name: "Keep section" }
    sleep_after_keep: 1000

    # Step 6: Delete again -> Remove section (branch B)
    R_click_delete_again: { role: "button", name: "Delete" }
    sleep_after_delete_again: 1000

    R_click_remove_section: { role: "button", name: "Remove section" }
    sleep_after_remove: 500
    
    # Step 7: Restore event description
    R_click_restore_to_default: { role: "button", name: "Restore to default" }
    sleep_after_restore: 500

    R_click_reset: { role: "button", name: "Reset" }
    sleep_after_reset: 500

  expect_result:
    description: "Event info (title, venue, date, description) should auto-sync to post title, post card subtitle, and RTE components"
    assertions:
      - assertion_type: "element_visible_by_text"
        text: "T5390"
      - assertion_type: "element_visible_by_text"
        text: "Apr 20"
      - assertion_type: "element_visible_by_text"
        text: "AboutT5390"

