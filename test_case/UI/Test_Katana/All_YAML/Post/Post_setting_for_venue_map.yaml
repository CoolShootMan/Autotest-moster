        # Refresh page to ensure latest state
        reload_page: {}
        sleep_step: 2000
        
        # Click "Add to shop" button to resell the Post (is_coseller: true)
        # [Idempotency 2026-09-01] "Add to shop" only renders when the post is NOT yet in the co-seller's
        # shop. Once it is (either resold by a previous run, or pushed automatically when the owner added
        # this co-seller via T3991's "Add to co-seller Pear Shops" flow), the button is replaced by a
        # "Find in my shop" link (href="/autotest-coseller") — verified in the failing run's DOM capture,
