# ==============================================================================
# Test Case: T5033_5034 Verify the "Choose call-to-action type" function of the event post
# ==============================================================================
testT5033_5034_VerifyPartner:
    description: "Verify the 'Choose call-to-action type' function of the event post"
    test_step:
        # Step 1: Duplicate ticket
        open_events_1: "{BASE_URL}/events"
        sleep_step: 3000
        R_click_event_1: { role: "cell", name: "verify-post-shipping_fee", optional: false }
        sleep_step: 2000
        # R_click_tickets_tab_1: { role: 'tab', name: 'Tickets', exact: true }
        # sleep_after_tickets_tab: 1500
        # Step 1: Duplicate 2 tickets via each ticket card's "Tools" -> "Duplicate" (IN-PLACE)
        # (verified 2026-08-10 on release): the ticket card has a "Tools" button whose menu
        # contains an in-place "Duplicate" menuitem. It opens a pre-filled
        # /events/{id}/products/{pid}/duplicate?mode=TICKET form; clicking the "Duplicate"
        # submit button at the bottom creates the copy and returns to the event (ticket count 1->2).
        # NOTE: the event's three-dot "More action" menu only has the CROSS-EVENT
        # "Duplicate ticket from…" — that is NOT what we want here.
        R_click_tools_1: { role: "button", name: "Tools" }
        sleep_step: 800
        R_click_duplicate_menuitem_1: { role: "menuitem", name: "Duplicate", exact: true }
        sleep_step: 1000
        R_click_duplicate_submit_1: { role: "button", name: "Duplicate" }
        sleep_step: 3000
        smart_click_optional_duplicate: { role: 'button', name: 'Duplicate', timeout: 3000 }
        # duplicate SPA-redirect is unreliable in automation; force-navigate back to the event
        # (suffix _2 avoids YAML duplicate-key collapse: test_step is a dict, so a repeated bare
        #  "open"/"R_click_event" key would be folded to its LAST occurrence and silently skipped)
        # open_events_2: "{BASE_URL}/events"
        # sleep_step: 3000
        # R_click_event_2: { role: "cell", name: "verify-post-shipping_fee", optional: false }
        # sleep_step: 2000
        # R_click_tickets_tab_1b: { role: "tab", name: "Tickets", exact: true }
        # sleep_step: 1500
        # R_click_tools_2: { role: "button", name: "Tools" }
        # sleep_step: 800
        # R_click_duplicate_menuitem_2: { role: "menuitem", name: "Duplicate", exact: true }
        # sleep_step: 3000
        # R_click_duplicate_submit_2: { role: "button", name: "Duplicate" }
        # sleep_step: 2000
        # verify_toast: { text: "Product duplicated successfully", optional: true }
        # force-navigate back to the event so Step 2 starts on the event view
        # (suffix _3 for the same duplicate-key-collapse reason as above)

        # Step 2: Create a post
        #R_click_event_tab_2: { role: 'tab', name: 'Event', exact: true }
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000
        R_click_Create_post: { role: "button", name: "Add another post" }
        sleep_after_create_post: 2500
        # "Add another post" triggers a "Your event is ready to share!" modal (no Confirm button
        # exists). Dismiss it via its primary "Apply" button. optional:true so the run still proceeds
        # if the modal happens not to appear (e.g. shown only once per event / already dismissed).
        R_click_apply_ready: { role: "button", name: "Apply", optional: true }
        sleep_step: 1500
        # After "Apply" we are already on the event detail Posts tab with the post cards
        # rendered. Open the (first) post directly — no need to round-trip back to the
        # /events listing and re-enter (that path required a now-missing open_events_4 nav
        # and was fragile). Clicking the post card action area opens the post editor
        # (Content tab, with a Selling tab available).
        # [UI drift 2026-08-31] Post card test_id click removed (Post tab shows post directly)
        sleep_step: 2000

        # Step 3: Switch to Selling tab and customize products
        click_container_button_3: { container: "Selling", container_locator: "..", button: "//button[@role='tab']", button_index: 1}
        sleep_step: 1500
        R_click_select_products: { test_id: "enhance-button-cta" }
        sleep_step: 2000

        # Step 4: Add test_general_products and customize ITS call-to-action.
        # The target post may already contain many products (env data drift), so every
        # action is scoped to the "test_general_products" product entry by name instead of
        # assuming fixed products.* indices (those broke once the post accumulated products).
        # First search for "test_general_products" to make it the only visible card
        fill_product_search_4: { locator: 'input[placeholder="Search product"]', value: 'test_general_products' }
        sleep_step: 500
        # Select-products dialog Search button has NO accessible name -> trigger via Enter
        # (mirrors T2874/T2834 verified pattern; clicking role=button name=Search fails)
        press_search_4: { key: "Enter" }
        sleep_step: 1500
        # click the test_general_products card (first/only visible card after search)
        click_product_card_5: { test_id: 'SquareLineIcon', index: 0 }
        # Add button text is "Add N/20 product(s)" where N varies with the post's existing
        # product count — match on the stable "product(s)" substring, not a hardcoded count.
        click_add_product_btn_1: { role: 'button', name: 'product(s)' }
        sleep_step: 2000

        # Expand test_general_products details (scoped to its product card by name)
        R_click_expand_details: { test_id: "ExpandMoreIcon", index: 2 }
        verify_text_hidden: { text: "Choose call-to-action type", timeout: 5000 }
        sleep_step: 1000

        # Check its "isCtaCustomized" (scoped to the product card; set_checked is idempotent)
        R_click_expand_details_2: { test_id: "ExpandMoreIcon", index: 1 }
        check_CTACustomized: { locator: "input[name$='products.1.isCtaCustomized']" }
        sleep_step: 500
        # Set its Buy now CTA option -> "View options"
        # 按钮选择器 [aria-haspopup='listbox']:has-text('Buy now') 正确（整页唯 1 个）。
        # 容器不能用 container_text="General Admission"：MUI 把 Advanced settings
        # (CTA checkbox + Buy now) 渲染在产品卡 data-testid="content" 之外，
        # page.locator("div", has_text="General Admission").last 取到的是产品名字
        # wrapper，不含 Buy now → 超时。实测：整页只有 1 个 Buy now 且只在 dialog
        # 内，故用 container_locator 直接锁定 dialog（不动 framework）。
