        # sleep_step: 500
        # R_click_customize_now: { locator: "span:has-text('Customize Now')", optional: true, timeout: 5000 }
        # sleep_step: 3000

        # # Click Publish button to publish the resold post (first click may open confirmation dialog)
        # # 使用 smart_click_retry: 元素一定存在，但点击可能不稳定（动画遮罩等），需要重试
