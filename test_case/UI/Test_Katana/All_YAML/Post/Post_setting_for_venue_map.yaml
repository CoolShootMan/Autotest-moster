# T3686: Verify the order confirmation note is displayed on order placed page when purchased through Coseller's shop
#
# Step description:
# 1. Coseller logs into Pear.us and navigates to the original Post
# 2. Click "Add to shop" to resell the Post (with is_coseller: true)
# 3. Navigate to the Coseller's resold Post page
# 4. Guest adds to cart, checkout, place order
# 5. Verify confirmation note displayed on order placed page
#
# Expected result:
# 1. Coseller can successfully resell the Post via "Add to shop"
# 2. Order Confirmation Note displayed below order details on order placed page
#    (same note content as set by Curator on the original Post)
# ==============================================================================

testT3686_CosellerResell:
#Auth: Linda Zhou
    is_coseller: true
    # [Deferred 2026-09-02] Seat-map purchase requires a logged-in buyer; this test logs out to
    # guest (and co-seller self-purchase / owner-via-coseller-link are both blocked), so the table
    # can never be selected (fails at R_click_continue). Note inheritance IS verified on the
    # Settings page (verify_note_content). Re-enable once a +997 buyer path exists.
    skip: true
    description: "Verify Order Confirmation Note is displayed when purchasing through Coseller's resold Post"
    test_step:

        # T3686 Step 1 2: Navigate to original Post and click "Add to shop" to resell
        open_post: 
          url: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
          # cookie_file: 'test_case/UI/Test_Katana/cookie_{ENV}_co_seller.json"'
